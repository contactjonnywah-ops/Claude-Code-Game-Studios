const FOREST = offsetDir(HOME, 3.2, 2.6);

  { dir: HOME, r: 0.52, h: 1.35 }, { dir: CAMP, r: 0.4, h: 1.3 }, { dir: PEN, r: 0.24, h: 1.05 },
  { dir: offsetDir(HOME, 4.5, 4.3), r: 0.09, h: 2.6 }, // the Spine: a crag too steep to climb
  { dir: offsetDir(HOME, 5.6, 0.9), r: 0.08, h: 2.4 },
  { dir: HOME.clone().applyAxisAngle(XAX, 1.9), r: 0.22, h: 1.2 }, // far islands
  { dir: HOME.clone().applyAxisAngle(YAX, -1.9), r: 0.2, h: 1.1 },
  { dir: CAMP.clone().applyAxisAngle(XAX, -1.2), r: 0.17, h: 1.1 },

const FLATS = [{ dir: HOME, r: 1.6, h: 0.45 }, { dir: CAMP, r: 2.6, h: 0.5 }];

for (let i = 1; i <= 30; i++) FORD_SAMPLES.push(slerpDir(FORDMID, CAMP, i / 30));

// ---- The blue tribe -------------------------------------------------------------------

const pendingSfx = []; // sound after a delay, counted in game time

// ---- Play: the step -------------------------------------------------------------------

  const h = heightAt(d);
  if (h < 0.02 || h > tune.cliff || hotAt(d)) { say('Totems need dry ground'); tone(110, 0.15, 'square', 0.08); return; }
  if (totems.length >= tune.totemMax) removeTotem(totems[0]);
  addTotem(kind, d); assignCrews(); tone(kind === 'war' ? 330 : kind === 'build' ? 392 : 523, 0.25, 'sine', 0.2);
  addFx('ring', d, 0.6, TOTEM_COL[kind][0], 0.6);

    const s = state.spell, cost = tune[SPELLS[s].costK];
    if (state.mana < cost) { say(`${SPELLS[s].name} needs ${cost} mana`); tone(110, 0.2, 'square', 0.1); return; }
    state.cast = { spell: s, dir: d }; state.spell = null; shaman.goal = null;
    if (dist(shaman.dir, d) > tune[s + 'Range']) say('Your shaman walks into range…', 1.5);

function updPlay(dt) {

  if (down.has('ArrowUp')) spin(0, -ks); if (down.has('ArrowDown')) spin(0, ks);
  if (pressed('Space') && !shaman.dead) focus(shaman.dir);
  if (pressed('KeyH')) focus(hearth.dir);
  if (pressed('KeyF') && state.alert) focus(state.alert);
  if (pressed('Equal') || pressed('NumpadAdd')) view.dist = Math.max(17, view.dist - 3);
  if (pressed('Minus') || pressed('NumpadSubtract')) view.dist = Math.min(48, view.dist + 3);
  // Orders
  if (pressed('Digit1')) plant('gather');
  if (pressed('Digit2')) plant('build');

  // The tribe

  let working = 0, idle = 0;
  for (const u of units) {

    else if (u.kind === 'shaman') updShaman(u, dt);

  }
  countUp();
  state.mana = Math.min(tune.manaMax, state.mana + dt * (working * tune.manaWork + idle * tune.manaIdle + state.huts * tune.manaHut));
  for (const h of huts) {
    if (h.dead) continue; h.flash -= dt; h.h = heightAt(h.dir);
    if (h.team === 0 && h.done && (h.spawnT -= dt) <= 0) {
      h.spawnT = tune.hutSpawn;

    }

  huts = huts.filter(h => { if (h.dead && h.dying <= 0) { moon.remove(h.mesh); return false; } return true; });
  for (const t of trees) if (t.dead && t.dying > 0 && (t.dying -= dt) <= 0) moon.remove(t.mesh);
  trees = trees.filter(t => !(t.dead && t.dying <= 0 && t.dying !== undefined) && !(t.dead && t.dying === undefined));
  for (const f of fx) if ((f.t += dt) >= f.dur) { moon.remove(f.mesh); f.done = true; }

    scene = 'results'; tone(392, 0.4, 'triangle', 0.25); tone(523, 0.6, 'triangle', 0.2); tone(659, 0.9, 'triangle', 0.2);
  } else if (state.followers === 0) {

}

    f.mesh.position.copy(f.dir).multiplyScalar(R + f.h + 0.1);
    if (f.kind === 'ring') { place(f.mesh, f.dir, f.h, null, 0.05); f.mesh.scale.set(f.size * (0.3 + k), 0.04, f.size * (0.3 + k)); }
    else f.mesh.scale.setScalar(f.size * (0.3 + k * 0.9));
    f.mesh.material.opacity = 0.8 * (1 - k);
  }
  // Aim: the shaman's range, and what the spell will cover
  ringLine.visible = aimLine.visible = false;
  const sp = state.spell || (state.cast && state.cast.spell);
  if (sp && !shaman.dead && scene === 'play') {
    drawRing(ringLine, shaman.dir, tune[sp + 'Range']);
    const d = state.cast ? state.cast.dir : pick(mouse.x, mouse.y);
    if (d) {
      const rad = sp === 'ember' ? tune.emberRadius : sp === 'raise' ? tune.raiseRadius : tune.fissureRadius;
      let ell = null;
      if (sp === 'fissure') {
        const head = V().subVectors(d, shaman.dir); head.addScaledVector(d, -head.dot(d));
        if (head.lengthSq() > 1e-8) { head.normalize(); const ax = dist(shaman.dir, d) < tune.fissureRadius * 1.6 ? V().crossVectors(d, head).normalize() : head; ell = { ax, bx: V().crossVectors(d, ax).normalize() }; }
      }
      drawRing(aimLine, d, rad, ell);
    }
  }
  renderer.render(world, camera);
}

// ---- HUD ------------------------------------------------------------------------------
function panel(x, y, w, h, a = 0.55) {
  ctx.fillStyle = `rgba(20,10,30,${a})`; ctx.strokeStyle = 'rgba(255,150,80,0.45)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill(); ctx.stroke();
}
function icon(kind, x, y, s, on) { // HUD glyphs, drawn as paths
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.lineWidth = 2.2 / s; ctx.lineJoin = 'round';
  const c = on ? 1 : 0.35;
  const col = { gather: '#9ad040', build: '#ffb030', war: '#ff5040', ember: '#ffa040', raise: '#d0a080', fissure: '#ff5a20', wood: '#b07a48', mana: '#ffb040', folk: '#e0782a', blue: '#5a8ad0' }[kind];
  ctx.globalAlpha = c; ctx.fillStyle = col; ctx.strokeStyle = col;
  ctx.beginPath();
  if (kind === 'gather') { ctx.moveTo(0, -10); ctx.quadraticCurveTo(9, -2, 0, 10); ctx.quadraticCurveTo(-9, -2, 0, -10); ctx.fill(); ctx.strokeStyle = '#2a3a10'; ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 8); ctx.stroke(); }
  else if (kind === 'build') { ctx.moveTo(-10, 0); ctx.lineTo(0, -10); ctx.lineTo(10, 0); ctx.lineTo(7, 0); ctx.lineTo(7, 9); ctx.lineTo(-7, 9); ctx.lineTo(-7, 0); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#301808'; ctx.fillRect(-2.5, 3, 5, 6); }
  else if (kind === 'war') { ctx.moveTo(0, -11); ctx.lineTo(3, -4); ctx.lineTo(1.5, -4); ctx.lineTo(1.5, 10); ctx.lineTo(-1.5, 10); ctx.lineTo(-1.5, -4); ctx.lineTo(-3, -4); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(-7, 2); ctx.lineTo(7, 2); ctx.stroke(); }
  else if (kind === 'ember') { ctx.moveTo(0, -11); ctx.bezierCurveTo(8, -3, 8, 6, 0, 10); ctx.bezierCurveTo(-8, 6, -8, -3, 0, -11); ctx.fill(); ctx.fillStyle = '#fff0a0'; ctx.beginPath(); ctx.moveTo(0, -2); ctx.bezierCurveTo(4, 2, 4, 6, 0, 8); ctx.bezierCurveTo(-4, 6, -4, 2, 0, -2); ctx.fill(); }
  else if (kind === 'raise') { ctx.moveTo(-11, 9); ctx.lineTo(-4, -2); ctx.lineTo(0, 3); ctx.lineTo(5, -8); ctx.lineTo(11, 9); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(5, -4); ctx.lineTo(5, -11); ctx.moveTo(2, -8); ctx.lineTo(5, -11); ctx.lineTo(8, -8); ctx.stroke(); }
  else if (kind === 'fissure') { ctx.fillStyle = '#4a3a40'; ctx.fillRect(-11, -4, 22, 13); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-3, -4); ctx.lineTo(1, 1); ctx.lineTo(-2, 4); ctx.lineTo(2, 9); ctx.lineTo(5, 9); ctx.lineTo(2, 4); ctx.lineTo(5, 1); ctx.lineTo(1, -4); ctx.closePath(); ctx.fill(); }
  else if (kind === 'wood') { ctx.fillRect(-10, -3, 20, 7); ctx.fillStyle = '#e0b080'; ctx.beginPath(); ctx.ellipse(10, 0.5, 2.5, 3.5, 0, 0, 6.3); ctx.fill(); }
  else if (kind === 'mana') { ctx.moveTo(0, -10); ctx.lineTo(7, 0); ctx.lineTo(0, 10); ctx.lineTo(-7, 0); ctx.closePath(); ctx.fill(); }
  else if (kind === 'folk' || kind === 'blue') { ctx.moveTo(0, -4); ctx.lineTo(7, 10); ctx.lineTo(-7, 10); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(0, -7, 3.5, 0, 6.3); ctx.fillStyle = kind === 'folk' ? '#c89070' : '#b08a78'; ctx.fill(); }
  ctx.restore();
}
const HINTS = [
  'Point at the dark ash pines and press 1: a Gather totem sends followers for wood',
  'Point near the hearth and press 2: a Build totem raises huts from the wood',
  'Drag or use the arrow keys to spin the moon. The blue camp lies east, over the sea',
  'Click the shore to walk your shaman there, then press W and click the sea: Raise lifts land',
  'Q Ember burns raiders · E Fissure swallows all that stands on it. Swallow every blue hut',
];
function drawHud() {
  ctx.clearRect(0, 0, W, H);
  // Resources
  panel(14, 14, 300, 92);
  icon('wood', 36, 38, 1, true); shadowText(`Wood ${state.wood}`, 54, 38, 18, '#f0d8c0', 'left');
  icon('folk', 160, 38, 1, true); shadowText(`Tribe ${state.followers}/${state.pop}`, 176, 38, 18, '#f0d8c0', 'left');
  icon('mana', 36, 76, 1, true);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(52, 66, 240, 20);
  ctx.fillStyle = '#ff9a30'; ctx.fillRect(52, 66, 240 * state.mana / tune.manaMax, 20);
  for (const k in SPELLS) { const x = 52 + 240 * tune[SPELLS[k].costK] / tune.manaMax; ctx.fillStyle = 'rgba(255,240,200,0.7)'; ctx.fillRect(x - 1, 63, 2, 26); }
  shadowText(`Mana ${Math.floor(state.mana)}`, 172, 76, 16, '#fff', 'center');
  // Rival and raid
  panel(W - 250, 14, 236, 60);
  icon('blue', W - 228, 36, 1, true); shadowText(`Blue huts left: ${state.rivalLeft}`, W - 210, 36, 18, '#c8dcff', 'left');
  const tm = Math.floor(state.t / 60), ts = Math.floor(state.t % 60);
  shadowText(`Time ${tm}:${String(ts).padStart(2, '0')}`, W - 210, 60, 16, '#d0c0e0', 'left');
  const toRaid = state.nextRaid - state.t;
  if (state.rivalLeft > 0) {
    const warn = toRaid <= tune.raidWarn;
    const raiding = units.some(u => !u.dead && u.role === 'raid');
    const s = raiding ? 'Raiders on your land!  F: look' : warn ? `Raid in ${Math.ceil(toRaid)}s!  F: look` : `Next raid in ${Math.floor(toRaid / 60)}:${String(Math.floor(toRaid % 60)).padStart(2, '0')}`;
    panel(W / 2 - 160, 14, 320, 36, raiding || warn ? 0.75 : 0.45);
    shadowText(s, W / 2, 32, 18, raiding || warn ? (Math.sin(state.t * 8) > 0 ? '#ff6a50' : '#ffd0a0') : '#e0d0f0');
  }
  // Off-screen alert arrow
  if (state.alert) {
    const p = toScreen(state.alert, 0.3);
    const on = p.facing && p.x > 40 && p.x < W - 40 && p.y > 60 && p.y < H - 110;
    if (on) {
      ctx.strokeStyle = '#ff5a40'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, 18 + Math.sin(state.t * 8) * 4, 0, 6.3); ctx.stroke();
    } else {
      let vx = p.facing ? p.x - W / 2 : p.wx, vy = p.facing ? p.y - H / 2 : -p.wy;
      const l = Math.hypot(vx, vy) || 1; vx /= l; vy /= l;
      const k = Math.min((W / 2 - 50) / Math.abs(vx || 1e-6), (H / 2 - 90) / Math.abs(vy || 1e-6));
      const ax = W / 2 + vx * k, ay = H / 2 + vy * k;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(Math.atan2(vy, vx));
      ctx.fillStyle = Math.sin(state.t * 8) > 0 ? '#ff5a40' : '#ffb090';
      ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-10, -12); ctx.lineTo(-4, 0); ctx.lineTo(-10, 12); ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }
  // Health bars over hurt things that face us
  const bar = (e, h, isHut) => {
    if (e.dead || e.hp >= e.maxHp) return;
    const p = toScreen(e.dir, h + (isHut ? 1.6 : 1.1)); if (!p.facing) return;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(p.x - 16, p.y - 3, 32, 5);
    ctx.fillStyle = e.team === 0 ? '#ffa040' : '#6aa0ff'; ctx.fillRect(p.x - 16, p.y - 3, 32 * Math.max(0, e.hp / e.maxHp), 5);
  };
  for (const u of units) bar(u, u.h, false);
  for (const h of huts) if (h.done) bar(h, h.h, true);
  // Action bar: totems and spells
  const slots = [['1', 'gather', 'Gather', ''], ['2', 'build', 'Build', ''], ['3', 'war', 'War', ''],
    ['Q', 'ember', 'Ember', 'ember'], ['W', 'raise', 'Raise', 'raise'], ['E', 'fissure', 'Fissure', 'fissure']];
  const bw = 86, bh = 70, gap = 8, total = slots.length * bw + (slots.length - 1) * gap + 22;
  let x = W / 2 - total / 2;
  slots.forEach(([key, ic, name, sp], i) => {
    if (i === 3) x += 22;
    const cost = sp ? tune[SPELLS[sp].costK] : 0, can = !sp || state.mana >= cost, armed = sp && (state.spell === sp || (state.cast && state.cast.spell === sp));
    panel(x, H - bh - 14, bw, bh, armed ? 0.85 : 0.6);
    if (armed) { ctx.strokeStyle = '#ffd080'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x, H - bh - 14, bw, bh, 8); ctx.stroke(); }
    icon(ic, x + bw / 2, H - bh + 12, 1.1, can);
    shadowText(key, x + 12, H - bh - 1, 15, '#ffe0b0', 'center');
    shadowText(sp ? `${name} ${cost}` : name, x + bw / 2, H - 30, 15, can ? '#f0e0d0' : '#8a7a80');
    x += bw + gap;
  });
  // Messages, hints, shaman
  if (shaman.dead) shadowText(`Your shaman is reborn at the hearth in ${Math.ceil(state.shamanT)}s`, W / 2, 120, 22, '#ffb080');
  else if (state.cast) shadowText(`Casting ${SPELLS[state.cast.spell].name} when in range… click elsewhere to cancel`, W / 2, H - 112, 16, '#ffd8a0');
  else if (state.spell) shadowText(`${SPELLS[state.spell].name}: click where to cast · ${SPELLS[state.spell].key.slice(3)} again to put it away`, W / 2, H - 112, 16, '#ffd8a0');
  if (state.msgT > 0) shadowText(state.msg, W / 2, 84, 20, '#fff0d0');
  if (state.hint < HINTS.length) {
    ctx.font = `17px ${FONT}`; const tw = ctx.measureText(HINTS[state.hint]).width;
    panel(W / 2 - tw / 2 - 16, H - 160, tw + 32, 32, 0.7);
    shadowText(HINTS[state.hint], W / 2, H - 144, 17, '#ffe8b0');
  }
}

// ---- Figures scene: every unit and prop, named --------------------------------------------
const figWorld = new THREE.Scene(); figWorld.background = new THREE.Color(0x150c26);
figWorld.add(new THREE.HemisphereLight(0x9a7ae0, 0x2a1420, 1.3));
const figSun = new THREE.DirectionalLight(0xffd2a0, 2.4); figSun.position.set(-3, 5, 6); figWorld.add(figSun);
const figCam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
figCam.position.set(0, 2.4, 9.5); figCam.lookAt(0, 0.6, 0);
const FIGS = [['Shaman', makeShaman], ['Follower', makeFollower], ['Follower with wood', () => { const g = makeFollower(); g.userData.log.visible = true; return g; }],
  ['Blue warrior', makeWarrior], ['Your hut', () => makeHut(0)], ['Blue hut', () => makeHut(1)], ['Gather totem', () => makeTotem('gather')],
  ['Build totem', () => makeTotem('build')], ['War totem', () => makeTotem('war')], ['Ash pine', makeTree], ['Hearth', makeHearth]];
const figPos = [];
FIGS.forEach(([name, mk], i) => {
  const g = mk(); const row = i < 6 ? 0 : 1, col = row ? i - 6 : i, n = row ? 5 : 6;
  g.position.set((col - (n - 1) / 2) * 1.5, row ? -0.9 : 1.3, row ? 0.5 : 0);
  g.scale.multiplyScalar(1.2); g.rotation.y = -0.5; figWorld.add(g); figPos.push([name, g.position.clone()]);
});
const figGround = new THREE.Mesh(new THREE.BoxGeometry(11, 0.1, 5), M(0x3b3037)); figGround.position.set(0, -1.0, 0); figWorld.add(figGround);
const figGround2 = new THREE.Mesh(new THREE.BoxGeometry(11, 0.1, 1.6), M(0x4f3f46)); figGround2.position.set(0, 1.2, 0); figWorld.add(figGround2);

const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      renderer.render(figWorld, figCam); ctx.clearRect(0, 0, W, H);
      for (const [name, p] of figPos) {
        const s = p.clone().add(V(0, -0.2, 0)).project(figCam);
        shadowText(name, (s.x + 1) / 2 * W, (1 - s.y) / 2 * H + 18, 16, '#ffe0c0');
      }
      shadowText('Ember Moon: figures', W / 2, 30, 24, '#fff');
    },
  },
  title: {
    update(dt) {
      state.t += dt; spin(0.06 * dt, 0);
      if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; }
    },
    draw() {
      drawMoon(); ctx.clearRect(0, 0, W, H);
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(10,4,20,0.75)'); g.addColorStop(0.6, 'rgba(10,4,20,0.35)'); g.addColorStop(1, 'rgba(10,4,20,0.8)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      shadowText(TITLE, W / 2, 130, 76, '#ffb060');
      shadowText('Spin the moon. Plant totems. Crack the crust.', W / 2, 190, 22, '#f0d8c0');
      panel(W / 2 - 330, 240, 660, 230, 0.6);
      CONTROLS.forEach((c, i) => shadowText(c, W / 2, 275 + i * 40, 19, '#f0e0d0'));
      shadowText('Swallow every blue hut into the crust. If your whole tribe falls, the moon is lost.', W / 2, 520, 18, '#ffd0a0');
      shadowText('Enter to start', W / 2, H - 80, 28, Math.sin(state.t * 3) > -0.3 ? '#fff' : '#ffb060');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      updPlay(dt);
    },
    draw() { drawMoon(); drawHud(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; },
    draw() { scenes.play.draw(); ctx.fillStyle = 'rgba(10,4,20,0.5)'; ctx.fillRect(0, 0, W, H); shadowText('Paused', W / 2, H / 2, 48, '#fff'); shadowText('P to carry on', W / 2, H / 2 + 50, 22, '#e0d0f0'); },
  },
  over: {
    update() { if (pressed('KeyR') || pressed('Enter')) { reset(); scene = 'play'; } },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(10,4,20,0.6)'; ctx.fillRect(0, 0, W, H);
      shadowText(state.gained || 'Game over', W / 2, H / 2 - 40, 38, '#ffb080');
      shadowText(`Blue huts swallowed ${state.swallowed}, burned ${state.burned} · raids weathered ${state.raidN}`, W / 2, H / 2 + 10, 20, '#e0d0f0');
      shadowText('R to restart the moon', W / 2, H / 2 + 56, 26, '#fff');
    },
  },
  results: {
    update() { if (pressed('Enter')) { reset(); scene = 'play'; } },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(10,4,20,0.55)'; ctx.fillRect(0, 0, W, H);
      shadowText('The ember moon is yours', W / 2, H / 2 - 80, 48, '#ffb060');
      shadowText(state.gained, W / 2, H / 2 - 24, 24, '#f0e0d0');
      shadowText(`Score ${state.score}: Enter to play again`, W / 2, H / 2 + 30, 26, '#fff');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
