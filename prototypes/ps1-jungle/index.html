<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: monospace; color: #ccc; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; text-align: center; z-index: 10;
  }
  #overlay h1 { color: #8b4513; font-size: 2rem; margin: 0 0 1rem; }
  #overlay p { max-width: 460px; line-height: 1.5; }
  #overlay button {
    margin-top: 1.2rem; padding: 0.7rem 1.4rem; font-size: 1rem;
    background: #3a2010; color: #fff; border: 1px solid #8b4513; cursor: pointer;
  }
  #hud { position: absolute; bottom: 10px; left: 10px; font-size: 13px; pointer-events: none; text-shadow: 1px 1px 2px #000; }
  #brightnessLabel { position: absolute; top: 10px; left: 10px; font-size: 13px; pointer-events: none; text-shadow: 1px 1px 2px #000; }
  #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; background: #fff; opacity: 0.5; pointer-events: none; display: none; }
  #mobileControls { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  #joystick { position: absolute; bottom: 30px; left: 30px; width: 110px; height: 110px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; pointer-events: auto; touch-action: none; }
  #joystickKnob { position: absolute; width: 44px; height: 44px; background: rgba(255,255,255,0.4); border-radius: 50%; left: 33px; top: 33px; pointer-events: none; }
  #lookZone { position: absolute; top: 0; right: 0; width: 55%; height: 100%; pointer-events: auto; touch-action: none; }
  #btnFlash, #btnCrank, #btnUse, #btnCam {
    position: absolute; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; pointer-events: auto;
    display: flex; align-items: center; justify-content: center; text-align: center; border: 2px solid #666;
  }
  #btnFlash, #btnCrank, #btnUse, #btnCam { width: 54px; height: 54px; font-size: 10px; }
  #btnUse { bottom: 220px; right: 24px; }
  #btnFlash { bottom: 150px; right: 24px; }
  #btnCrank { bottom: 80px; right: 24px; }
  #btnCam { bottom: 115px; right: 90px; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; }
  #shot { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #prompt { position: absolute; left: 0; right: 0; bottom: 22%; text-align: center; font-size: 15px; color: #e0b070; pointer-events: none; text-shadow: 1px 1px 2px #000; }
  #msg { position: absolute; left: 0; right: 0; top: 16%; text-align: center; font-size: 15px; padding: 0 16px; pointer-events: none; text-shadow: 1px 1px 2px #000; }
  #noteView { display: none; position: absolute; inset: 0; z-index: 8; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  #noteView div { max-width: 460px; background: #d8d2bc; color: #1c1a15; padding: 20px; font-size: 15px; line-height: 1.5; white-space: pre-line; }
  #noteView button { display: block; margin: 16px auto 0; min-height: 44px; min-width: 140px; font: inherit; }
  body.mobile #mobileControls { display: block; }
  /* Options: one row per setting, finger-sized targets, scrolls when taller than the screen */
  #options { overflow-y: auto; padding: 16px; box-sizing: border-box; }
  #optList { display: grid; gap: 4px; width: min(100%, 440px); }
  #optList label { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-size: 16px; text-align: left; }
  #optList select, #optList input[type=range] { width: 58%; height: 44px; font-size: 16px; margin: 0; }
  #optList input[type=range] { width: 42%; margin-left: auto; }
  #optList output { width: 3.4em; text-align: right; color: #e0b070; }
  #optList select { background: #222; color: #fff; border: 1px solid #666; }
  #optList input[type=checkbox] { width: 28px; height: 28px; margin: 0; }
  #overlay button, #optionsClose { min-height: 48px; min-width: 160px; font-size: 16px; font-family: inherit; }
</style>
</head>
<body>

  <div id="optList">

    <label><span>Dither</span><select id="optDither"><option value="0">None</option><option value="1" selected>Bayer 4×4</option><option value="2">Bayer 8×8</option><option value="3">Noise</option></select></label>
    <label><span>Noise</span><input id="optNoise" type="range" min="0" max="0.5" step="0.01" value="0.22"></label>

  <div style="position:absolute;top:0;left:0;right:0;height:8%;background:#000;"></div>

</div>
<div id="hud">FPS: --</div>
<div id="fade"></div>

<div id="brightnessLabel"></div>

<div id="msg"></div>
<div id="noteView"><div><span id="noteText"></span><button id="noteClose">Close</button></div></div>
<div id="crosshair"></div>

  <div id="joystick"><div id="joystickKnob"></div></div>
  <div id="lookZone"></div>
  <button id="btnFlash">FLASH</button>

  <button id="btnOptions" style="position:absolute;top:24px;left:24px;width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,0.55);color:#fff;border:2px solid #666;pointer-events:auto;font-size:10px;">OPT</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

const LOW_W = 160, LOW_H = 120;
const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// Facility layout. One character per 1.6 m cell. Row 0 is the north wall, facing the forest.
// # wall  . floor  D exit door  S start  N note  T torch  K keycard  C camera  P breached pen  H howler start
const FAC_MAP = [
  '#####D#####',
  '#K..#C#..P#',
  '#..H#.#...#',
  '#.###.#.###',
  '#.........#',
  '###.#####.#',
  '#...#.N.TS#',
  '###########'
];
const ROWS = FAC_MAP.length, COLS = FAC_MAP[0].length;
const CS = 1.6, FAC_X0 = -COLS * CS / 2, FAC_Z0 = 18.2, WALL_H = 3;
const facOpen = FAC_MAP.map(row => [...row].map(ch => ch !== '#' && ch !== 'D')); // the door cell opens later
const cellOf = (x, z) => [Math.floor((z - FAC_Z0) / CS), Math.floor((x - FAC_X0) / CS)];
const cellCenter = (r, c) => [FAC_X0 + (c + 0.5) * CS, FAC_Z0 + (r + 0.5) * CS];
const isOpen = (r, c) => !!(facOpen[r] && facOpen[r][c]);
const findCell = ch => { const r = FAC_MAP.findIndex(row => row.includes(ch)); return [r, FAC_MAP[r].indexOf(ch)]; };

// Rolling forest floor, flattened to 0 under and in front of the facility.
// One function: mesh, props, player, creatures and rain all read it.
const groundH = (x, z) => {
  const f = Math.min(1, Math.max(0, (z - 13) / 4)), flat = f * f * (3 - 2 * f);
  return (Math.sin(x * 0.35 + 1.3) * 0.5 + Math.cos(z * 0.28 + 0.5) * 0.6 +
    Math.sin((x + z) * 0.6) * 0.2 + Math.sin(x * 1.3) * Math.cos(z * 1.1) * 0.12) * (1 - flat);
};
const fz = z => z > 14 ? z - 10 : z; // keep scattered clutter off the facility apron
const EYE = 1.6;

const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const lowRes = new THREE.WebGLRenderTarget(LOW_W, LOW_H, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat,
  type: THREE.HalfFloatType, // HDR: lights above 1.0 survive for bloom + tone mapping
  depthTexture: new THREE.DepthTexture(LOW_W, LOW_H)
});
const crushRT = new THREE.WebGLRenderTarget(LOW_W, LOW_H, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter
});

// Post-process, two passes:
//  1. postMat (low-res): volumetric fog + bloom + tone map + grade, bit-crush LAST
//  2. upMat (screen-res): nearest upscale + chroma fringe + scanlines
const upScene = new THREE.Scene();
const upCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadVert = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const postMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: lowRes.texture },
    tDepth: { value: lowRes.depthTexture },
    res: { value: new THREE.Vector2(LOW_W, LOW_H) },
    time: { value: 0 },
    noiseAmount: { value: 0.22 },
    dither: { value: 1.0 },
    ditherMode: { value: 1 },
    chroma: { value: 0.004 },
    scanlines: { value: 0.06 },
    crush: { value: 14.0 },
    flashOn: { value: 1.0 },
    battery: { value: 1.0 },
    grade: { value: 1 }, // 0=cold, 1=warm, 2=panic
    exposure: { value: 1.4 },
    gamma: { value: 2.2 },
    contrast: { value: 1.0 },
    saturation: { value: 0.7 }, // 0 = grey, 1 = untouched
    bloom: { value: 0.8 },
    // volumetrics (camera + moon values are bound after those objects exist)
    volDensity: { value: 0.05 },
    lightning: { value: 0.0 },
    flashCone: { value: new THREE.Vector2(0.8, 0.95) },
    moonColor: { value: new THREE.Color() },
    moonDir: { value: new THREE.Vector3() },
    flashDir: { value: new THREE.Vector3(0, 0, -1) },
    glowPos: { value: Array.from({ length: 5 }, () => new THREE.Vector3()) }, // world space
    glowCol: { value: Array.from({ length: 5 }, () => new THREE.Color(0)) }, // view space, follows the lagging beam
    moonMap: { value: null },
    moonMatrix: { value: null },
    projInv: { value: null },
    camWorld: { value: null }
  },
  vertexShader: quadVert,
  fragmentShader: `
    #include <packing>
    uniform sampler2D tDiffuse, tDepth, moonMap;
    uniform mat4 projInv, camWorld, moonMatrix;
    uniform vec2 res, flashCone;
    uniform vec3 moonColor, moonDir, flashDir;
    uniform vec3 glowPos[5], glowCol[5];
    uniform float time, noiseAmount, dither, crush, flashOn, battery;
    uniform float exposure, bloom, volDensity, lightning, gamma, contrast, saturation;
    uniform int ditherMode, grade;
    varying vec2 vUv;

    float bayer4(vec2 p) {
      int x = int(mod(p.x, 4.0));
      int y = int(mod(p.y, 4.0));
      int i = y * 4 + x;
      float b[16] = float[](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
      return b[i] / 16.0;
    }
    float bayer8(vec2 p) {
      // 8x8 Bayer built from the 4x4: M8 = 4*M4 + M2
      vec2 q = mod(floor(p / 4.0), 2.0);
      float m2 = 2.0 * q.x + 3.0 * q.y - 4.0 * q.x * q.y;
      return (bayer4(p) * 64.0 + m2) / 64.0;
    }
    float rand(vec2 co) {
      return fract(sin(dot(co + time, vec2(12.9898, 78.233))) * 43758.5453);
    }
    float hash(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
    float vnoise(vec3 p) {
      vec3 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    vec3 aces(vec3 x) {
      return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
    }

    void main() {
      vec2 px = floor(vUv * res); // low-res pixel: dither + noise stay on the pixel grid
      vec2 uv = vUv - 0.5;
      vec3 col = texture2D(tDiffuse, vUv).rgb;

      // Bloom: 8 taps on two rings, only HDR values above 1.0 bleed
      vec3 glow = vec3(0.0);
      for (int i = 0; i < 8; i++) {
        float a = float(i) * 0.785398;
        vec2 o = vec2(cos(a), sin(a)) * (mod(float(i), 2.0) < 1.0 ? 1.5 : 3.5) / res;
        glow += max(texture2D(tDiffuse, vUv + o).rgb - 1.0, 0.0);
      }
      col += glow * 0.125 * bloom;

      // Volumetric fog: march the view ray up to scene depth.
      // Moon light is tested against its shadow map (shafts between trees).
      // The flashlight sits at the eye, so depth alone occludes it.
      float depth = texture2D(tDepth, vUv).x;
      vec4 vp = projInv * vec4(vUv * 2.0 - 1.0, depth * 2.0 - 1.0, 1.0);
      vp /= vp.w;
      float dist = length(vp.xyz);
      vec3 rd = vp.xyz / dist;
      float stepLen = min(dist, 30.0) / 16.0;
      float t = stepLen * bayer4(px); // dithered start hides the 16-step banding
      float cone = smoothstep(flashCone.x, flashCone.y, dot(rd, flashDir)) * flashOn;
      mat4 toMoon = moonMatrix * camWorld;
      // forward scattering: fog glows when looking toward the moon
      float phase = 0.008 + 0.25 * pow(max(dot(mat3(camWorld) * rd, moonDir), 0.0), 6.0);
      vec3 vol = vec3(0.0);
      for (int i = 0; i < 16; i++) {
        vec4 sc = toMoon * vec4(rd * t, 1.0);
        // drifting fog banks, thicker near the ground
        vec3 pw = (camWorld * vec4(rd * t, 1.0)).xyz;
        float dens = (0.3 + 1.7 * vnoise(pw * 0.3 + vec3(time * 0.12, time * 0.03, time * 0.08))) * exp(-max(pw.y, 0.0) * 0.22) * 1.5;
        float lit = 1.0;
        if (sc.x > 0.0 && sc.x < 1.0 && sc.y > 0.0 && sc.y < 1.0 && sc.z < 1.0)
          lit = step(sc.z - 0.003, unpackRGBAToDepth(texture2D(moonMap, sc.xy)));
        vec3 L = moonColor * lit * phase
               + vec3(1.0, 0.9, 0.75) * cone * 0.07 / (1.0 + 0.1 * t * t)
               + vec3(0.7, 0.8, 1.0) * lightning * 0.8;
        vol += L * dens * exp(-volDensity * t) * stepLen;
        t += stepLen;
      }
      col += vol * volDensity;

      vec3 ro = camWorld[3].xyz, rdW = mat3(camWorld) * rd;
      // Sky: moon disc + thin cloud lit around it. Depth test: the canopy hides it.
      if (depth > 0.9999) {
        float m = max(dot(rdW, moonDir), 0.0);
        col += vec3(0.75, 0.85, 1.0) * (smoothstep(0.9982, 0.9988, m) * 2.5
             + pow(m, 10.0) * 0.1 * vnoise(rdW * 6.0 + vec3(time * 0.03, 0.0, 0.0)));
      }
      // Point lights glow in the fog: closed-form in-scatter along the ray, no extra march
      float tEnd = min(dist, 30.0);
      for (int i = 0; i < 5; i++) {
        vec3 lp = glowPos[i] - ro;
        float tc = dot(lp, rdW);
        float h = max(length(lp - rdW * tc), 0.25);
        col += glowCol[i] * (atan((tEnd - tc) / h) + atan(tc / h)) / h * volDensity * 0.1;
      }

      // HDR to display
      col = aces(col * exposure);
      col = pow(col, vec3(1.0 / gamma));
      col = max((col - 0.5) * contrast + 0.5, 0.0);

      // Color grading presets
      if (grade == 0) col *= vec3(0.7, 0.85, 1.1);       // cold moonlight
      else if (grade == 1) col *= vec3(1.05, 0.95, 0.8); // warm torch
      else col = mix(col, vec3(dot(col, vec3(0.3, 0.5, 0.2))), 0.45); // panic

      float luma = dot(col, vec3(0.299, 0.587, 0.114));
      // Dim light loses its colour, as it does to the eye. Without this, faint red spill
      // from the point lights dithers into red speckle on everything nearby.
      col = max(mix(vec3(luma), col, saturation * smoothstep(0.0, 0.1, luma)), 0.0);

      // Battery-reactive vignette
      float vigStrength = 0.65 + (1.0 - battery) * 0.35;
      col *= 1.0 - smoothstep(0.2, 0.95, length(uv)) * vigStrength;

      // Animated noise, stronger in darkness
      float dark = 1.0 - flashOn * 0.6;
      col += (rand(px * 0.5) - 0.5) * noiseAmount * 0.12 * (0.6 + dark);

      // Bit-crush last, so nothing above smooths it back out
      float d = 0.0;
      if (ditherMode == 1) d = bayer4(px) - 0.5;
      else if (ditherMode == 2) d = bayer8(px) - 0.5;
      else if (ditherMode == 3) d = rand(px) - 0.5;
      // crush brightness, keep hue: clean dithered bands instead of rainbow speckle
      // The levels sit on a square curve: most of them in the dark end.
      float l = max(dot(col, vec3(0.299, 0.587, 0.114)), 1e-4);
      float q = floor(sqrt(l) * crush + 0.5 + d * dither) / crush;
      col *= q * q / l;
      // then the PS1 framebuffer: 5 bits per channel, same dither
      col = floor(col * 31.0 + 0.5 + d * dither) / 31.0;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const upMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: crushRT.texture },
    chroma: postMat.uniforms.chroma,       // shared objects: the option sliders drive both
    scanlines: postMat.uniforms.scanlines
  },
  vertexShader: quadVert,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float chroma, scanlines;
    varying vec2 vUv;
    void main() {
      vec2 dir = (vUv - 0.5) * chroma;
      vec3 col = vec3(texture2D(tDiffuse, vUv + dir).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - dir).b);
      col *= 1.0 - scanlines * mod(floor(gl_FragCoord.y), 2.0);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat);
upScene.add(quad);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e12);
scene.fog = new THREE.FogExp2(0x0a0e12, 0.03);

const camera = new THREE.PerspectiveCamera(72, LOW_W / LOW_H, 0.1, 80);
camera.position.set(0, groundH(0, 5) + EYE, 5);

const ambient = new THREE.HemisphereLight(0x334455, 0x10160c, 0.55);
scene.add(ambient);
const moon = new THREE.DirectionalLight(0x8899bb, 0.45);
moon.position.set(-31, 26.5, -22);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = moon.shadow.camera.bottom = -40;
moon.shadow.camera.right = moon.shadow.camera.top = 40;
moon.shadow.camera.near = 1;
moon.shadow.camera.far = 120;
moon.shadow.bias = -0.0004;
moon.shadow.autoUpdate = false; // refreshed every 4th frame in animate()
scene.add(moon);
const sun = new THREE.DirectionalLight(0xaabb88, 0.65);

// Materials – flat shaded + low-res painted textures for PS1 look
// Palette is a real temperate forest at night: grey-brown bark, blue-green needles,
// olive broadleaf, leaf-litter floor with moss, pale dead wood. Value contrast over hue.
// style: 'bark' vertical streaks + knots, 'leaf' gaps + highlights,
//        'mud' tiling patches of altColor + pebbles, 'rock' cracks, '' plain noise
function makePixelTexture(baseColor, noise = 0.15, size = 4, style = '', altColor = 0x3a2a18) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const split = hex => [(hex >> 16) & 255, (hex >> 8) & 255, hex & 255];
  const base = split(baseColor), alt = split(altColor);
  const streak = Array.from({ length: size }, () => Math.random() - 0.5);
  const TAU = Math.PI * 2;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let n = (Math.random() - 0.5) * noise, rgb = base;
      if (style === 'bark') {
        n = streak[x] * noise * 1.8 + n * 0.5;
        if (Math.random() < 0.05) n -= 0.3;
      } else if (style === 'leaf') {
        if (Math.random() < 0.22) n -= 0.28;
        else if (Math.random() < 0.1) n += 0.2;
      } else if (style === 'mud') {
        // sin/cos of whole periods: the patches tile
        const patch = Math.sin(x / size * TAU * 2 + 1) * Math.cos(y / size * TAU + 2) + Math.sin((x + y) / size * TAU * 3) * 0.4;
        const k = Math.max(0, Math.min(1, patch * 0.9 + 0.3));
        rgb = base.map((v, i) => v + (alt[i] - v) * k);
        if (Math.random() < 0.04) n += 0.35; // pebble
      } else if (style === 'rock') {
        if (Math.abs(x - size / 2 - streak[y] * size) < 0.6 || Math.random() < 0.04) n -= 0.35;
      }
      const px = rgb.map(v => Math.max(0, Math.min(255, v + n * 255)) | 0);
      ctx.fillStyle = `rgb(${px})`;
      ctx.fillRect(x, y, 1, 1);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

// Break up a primitive's outline. The offset is a hash of the vertex position,
// so vertices that share a position move together and the mesh stays closed.
function roughen(geo, amt) {
  const p = geo.attributes.position, seed = Math.random() * 100;
  const h = (x, y, z, k) => { const v = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719 + seed + k) * 43758.5453; return v - Math.floor(v) - 0.5; };
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    p.setXYZ(i, x + h(x, y, z, 1) * amt, y + h(x, y, z, 2) * amt, z + h(x, y, z, 3) * amt);
  }
  return geo;
}

// Trees + collision radii. Three silhouettes:
//  pine  – bare lower trunk, ragged drooping tiers, dead stubs below the crown
//  broad – forked limbs, each carrying a lumpy crown

const treeColliders = [], leaves = [];
const UP = new THREE.Vector3(0, 1, 0);
function makeTree(x, z, s, kind) {
  const g = new THREE.Group();
  const wood = kind === 'dead' ? deadMat : trunkMat;
  const H = (kind === 'dead' ? 4.5 + Math.random() * 2 : 7 + Math.random() * 1.5) * s;
  const trunk = new THREE.Mesh(roughen(new THREE.CylinderGeometry(0.09*s, 0.34*s, H, 6, 4), 0.08*s), wood);
  trunk.position.y = H / 2 - 0.3; // sunk into the ground: no gap on a slope
  g.add(trunk);
  // limb growing up and out from the trunk at height y; returns its tip
  const limb = (y, len, r) => {
    const a = Math.random() * 6.28, tilt = 0.6 + Math.random() * 0.7;
    const d = new THREE.Vector3(Math.cos(a) * Math.sin(tilt), Math.cos(tilt), Math.sin(a) * Math.sin(tilt));
    const b = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.35, r, len, 4), wood);
    b.quaternion.setFromUnitVectors(UP, d);
    b.position.copy(d).multiplyScalar(len / 2).setY(y + d.y * len / 2);
    g.add(b);
    return d.multiplyScalar(len).setY(y + d.y);
  };
  const crown = (mesh) => { leaves.push(mesh); g.add(mesh); return mesh; };
  if (kind === 'pine') {
    for (let i = 0; i < 2; i++) limb(H * (0.22 + Math.random() * 0.18), (0.5 + Math.random() * 0.6) * s, 0.05 * s);
    const tiers = 5;
    for (let i = 0; i < tiers; i++) {
      const t = i / (tiers - 1);
      const r = (2.1 - 1.55 * t) * s * (0.75 + Math.random() * 0.5);
      const tier = crown(new THREE.Mesh(roughen(new THREE.ConeGeometry(r, 1.9 * s, 7), 0.28 * s), i % 2 ? leafMat2 : leafMat));
      tier.position.set((Math.random()-0.5) * 0.3 * s, H * (0.45 + 0.55 * t), (Math.random()-0.5) * 0.3 * s);
      tier.rotation.y = Math.random() * 6;
    }
  } else if (kind === 'broad') {
    const tips = [new THREE.Vector3(0, H, 0)];
    for (let i = 0; i < 3; i++) tips.push(limb(H * (0.5 + Math.random() * 0.3), (1.8 + Math.random() * 1.2) * s, 0.11 * s));
    tips.forEach((tip, i) => {
      const blob = crown(new THREE.Mesh(roughen(new THREE.IcosahedronGeometry((1.2 + Math.random() * 0.8) * s, 0), 0.4 * s), i % 2 ? leafMat3 : leafMat2));
      blob.position.copy(tip);
      blob.scale.y = 0.6;
      blob.rotation.y = Math.random() * 6;
    });
  } else {
    for (let i = 0; i < 6; i++) limb(H * (0.35 + Math.random() * 0.6), (0.8 + Math.random() * 1.6) * s, 0.07 * s);
  }
  g.children.forEach(m => { m.castShadow = m.receiveShadow = true; });
  g.position.set(x, groundH(x, z), z);
  g.rotation.set((Math.random()-0.5) * 0.14, Math.random() * 6, (Math.random()-0.5) * 0.14); // nothing grows dead straight
  scene.add(g);
  treeColliders.push({ x, z, r: 0.5 * s });
}

// PS1 geometry: vertices snap to the pixel grid, textures map without perspective correction
const snapRes = { value: new THREE.Vector2(LOW_W / 2, LOW_H / 2) };
const affine = { value: 1 };
function applyVertexSnap(mat) {
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.snapRes = snapRes;
    shader.uniforms.affine = affine;
    // uv*w and w, both interpolated with perspective, divide back to a screen-linear uv
    shader.vertexShader = 'uniform vec2 snapRes;\nvarying vec3 vAffine;\n' + shader.vertexShader.replace(
      '#include <project_vertex>',
      `#include <project_vertex>
      gl_Position.xy = floor(gl_Position.xy / gl_Position.w * snapRes) / snapRes * gl_Position.w;
      vAffine = vec3(vMapUv * gl_Position.w, gl_Position.w);`
    );
    shader.fragmentShader = 'uniform float affine;\nvarying vec3 vAffine;\n' + shader.fragmentShader.replace(
      '#include <map_fragment>',
      THREE.ShaderChunk.map_fragment.replace('vMapUv', 'mix(vMapUv, vAffine.xy / vAffine.z, affine)')
    );
  };
}
worldMats.forEach(applyVertexSnap);
function updateSnap() {
  const on = document.getElementById('optSnap').checked;
  affine.value = on ? 1 : 0;
  // off = grid far finer than a pixel
  snapRes.value.set(on ? lowRes.width / 2 : 4096, on ? lowRes.height / 2 : 4096);
}
[groundMat, trunkMat, leafMat, leafMat2, rockMat, bushMat].forEach(applyVertexSnap);

// Audio
let audioCtx = null, ambientGain = null, footstepTimer = 0;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  ambientGain = audioCtx.createGain();
  ambientGain.gain.value = 0.06;
  ambientGain.connect(audioCtx.destination);
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 42;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 180;
  osc.connect(filter).connect(ambientGain);
  osc.start();
}
function playFootstep(vol = 1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  // Occlusion: quieter when near trees
  let occlude = 1.0;
  for (const c of treeColliders) {
    const dx = camera.position.x - c.x, dz = camera.position.z - c.z;
    if (dx*dx + dz*dz < 4.0) occlude *= 0.6;
  }
  osc.type = 'triangle';
  osc.frequency.value = 80 + Math.random()*40;
  g.gain.setValueAtTime(0.12 * occlude * vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
  osc.connect(g).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.12);
}

function handleJoy(t) {
  const dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
  const dist = Math.min(Math.hypot(dx, dy), 48);
  const a = Math.atan2(dy, dx);
  knob.style.transform = `translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist}px)`;
  mobileMove.x = Math.cos(a) * dist / 48;
  mobileMove.z = Math.sin(a) * dist / 48;
}

// ---------- where the player can stand
function walkable(x, z) {
  if (Math.abs(x) > 17.5 || z < -17.5) return false;
  if (z < FAC_Z0 - 0.3) return true; // forest
  // facility: the grid decides. Rows above the map are the ground outside the front wall.
  return [[-0.3, -0.3], [0.3, -0.3], [-0.3, 0.3], [0.3, 0.3]].every(([ox, oz]) => {
    const [r, c] = cellOf(x + ox, z + oz);
    return r < 0 || isOpen(r, c);
  });
}
function canStand(x, z, px, pz) {
  if (!walkable(x, z)) return false;
  for (const c of treeColliders) {
    const dx = x - c.x, dz = z - c.z, ox = px - c.x, oz = pz - c.z;
    // block only moves that go deeper in: a player who starts inside clutter can always walk out
    if (dx * dx + dz * dz < c.r * c.r && dx * dx + dz * dz < ox * ox + oz * oz) return false;
  }
  return true;
}
// straight line clear of facility walls? (trees do not block sight: shortcut, add when it matters)
function los(ax, az, bx, bz) {
  const n = Math.ceil(Math.hypot(bx - ax, bz - az) / 0.3);
  for (let i = 1; i < n; i++) {
    const [r, c] = cellOf(ax + (bx - ax) * i / n, az + (bz - az) * i / n);
    if (r >= 0 && r < ROWS && !isOpen(r, c)) return false;
  }
  return true;
}

// ---------- sound: small synthesized cues
function tone(f0, f1, dur, type = 'sine', vol = 0.2) {
  if (!audioCtx || vol < 0.004) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start();
  o.stop(t + dur);
}
const near = d => 1 / (1 + d * d * 0.03); // loudness of a creature at distance d

// breadth-first route over open cells; never enters row 0, so it cannot leave by the door
function route(from, to) {
  const key = (r, c) => r * COLS + c, prev = new Map([[key(...from), null]]), queue = [from];
  while (queue.length) {
    const [r, c] = queue.shift();
    if (r === to[0] && c === to[1]) break;
    for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nr = r + dr, nc = c + dc;
      if (nr < 1 || !isOpen(nr, nc) || prev.has(key(nr, nc))) continue;
      prev.set(key(nr, nc), [r, c]);
      queue.push([nr, nc]);
    }
  }
  const path = [];
  for (let cur = prev.has(key(...to)) ? to : null; cur; cur = prev.get(key(...cur))) path.unshift(cur);
  return path; // starts with its own cell: it re-centres before turning, so it never clips a corner
}
function howlerHear(x, z) {
  let [r, c] = cellOf(x, z);
  const inside = r >= 1;
  r = Math.max(1, r);
  if (!isOpen(r, c)) return;
  howler.heardT = clock.elapsedTime;
  if (howler.state === 'wander') { // first it stops, turns and howls: the player's warning
    tone(170, 430, 0.7, 'sawtooth', 0.35 * near(Math.hypot(howler.x - x, howler.z - z)));
    howler.state = 'alert';
    howler.wait = HOWLER.react;
    howler.face = Math.atan2(x - howler.x, z - howler.z);
    if (!game.warned) { game.warned = true; say('Something heard that. Stand still. Make no sound.', 5); }
  }
  howler.path = route(cellOf(howler.x, howler.z), [r, c]);
  howler.point = inside ? [x, z] : null; // the exact spot the sound came from
}
function updateHowler(dt, px, pz) {
  const h = howler, d = Math.hypot(px - h.x, pz - h.z);
  if ((h.click -= dt) <= 0) { // echolocation: you hear it coming
    h.click = h.state === 'hunt' ? 0.4 : 1.5;
    tone(2600, 1700, 0.03, 'square', 0.22 * near(d));
  }
  // Blind: it catches only a player it heard a moment ago. Stand silent and it walks straight past.
  if (d < HOWLER.catchDist && clock.elapsedTime - h.heardT < HOWLER.memory && los(px, pz, h.x, h.z)) return caught();
  if (h.state === 'alert' && (h.wait -= dt) <= 0) h.state = 'hunt';
  const goal = h.state === 'alert' ? null : h.path.length ? cellCenter(...h.path[0]) : h.point;
  if (goal) {
    const closing = h.state === 'hunt' && h.path.length <= 1; // inside the last cell: feel for it
    const gx = goal[0] - h.x, gz = goal[1] - h.z, gd = Math.hypot(gx, gz), step = HOWLER[closing ? 'search' : h.state] * dt;
    if (gd <= step) {
      h.x = goal[0]; h.z = goal[1];
      if (h.path.length) h.path.shift(); else h.point = null;
      if (!h.path.length && !h.point) { // arrived: stand and listen
        h.wait = h.state === 'hunt' ? HOWLER.listen : 1.5 + Math.random() * 2.5;
        h.state = 'wander';
      }
    } else {
      h.x += gx / gd * step; h.z += gz / gd * step;
      h.face = Math.atan2(gx, gz);
    }
  } else if (h.state === 'wander' && (h.wait -= dt) <= 0) {
    let r, c;
    do { r = 1 + Math.floor(Math.random() * (ROWS - 2)); c = 1 + Math.floor(Math.random() * (COLS - 2)); } while (!isOpen(r, c));
    h.path = route(cellOf(h.x, h.z), [r, c]);
  }
  const t = clock.elapsedTime, moving = !!goal;
  h.g.position.set(h.x, moving ? Math.abs(Math.sin(t * (h.state === 'hunt' ? 12 : 5))) * 0.06 : 0, h.z);
  let turn = h.face - h.g.rotation.y;
  turn = Math.atan2(Math.sin(turn), Math.cos(turn));
  h.g.rotation.y += turn * Math.min(1, dt * 8);
  h.head.rotation.y = moving || h.state === 'alert' ? 0 : Math.sin(t * 1.7) * 0.9; // standing still, it sweeps its head to listen
}

// ---------- the skulker: waits in the dark, dives at anything close, flees light
// dark points sit at the foot of trees on and around the route north
const DARK = [[2.9, 10.3], [-5.8, 5.5], [7.8, 5.6], [-3.8, -9.3], [6.6, -6.4], [-9.2, 0.6], [10.4, -2.5], [1.7, -10.6], [-8.5, -7.4], [0.8, 6.5]];
const skulkers = [0, 4].map(home => {
  const s = { g: new THREE.Group(), home, at: home, x: 0, z: 0, state: 'hide', t: 0, tx: 0, tz: 0, face: 0,
    eye: Object.assign(new THREE.Object3D(), { color: new THREE.Color(0xffa030), intensity: 0.1 }), eyeMat: unlit(0.25, 0.12, 0.02) };
  const part = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = mat !== s.eyeMat; s.g.add(m); return m; };
  part(new THREE.IcosahedronGeometry(0.3, 1), hideMat, 0, 0.36, 0).scale.set(0.7, 0.5, 2.0);       // long low body
  part(new THREE.ConeGeometry(0.15, 0.55, 5), hideMat, 0, 0.42, 0.85).rotation.x = Math.PI / 2;    // narrow head
  part(new THREE.ConeGeometry(0.11, 1.3, 5), hideMat, 0, 0.36, -1.15).rotation.x = -Math.PI / 2;   // whip tail
  [-1, 1].forEach(sd => {
    part(new THREE.IcosahedronGeometry(0.035, 0), s.eyeMat, sd * 0.07, 0.47, 0.82);
    [0.35, -0.35].forEach(lz => { part(new THREE.CylinderGeometry(0.03, 0.02, 0.5, 4), hideMat, sd * 0.28, 0.2, lz).rotation.z = sd * 0.8; });
  });
  s.eye.position.set(0, 0.47, 0.85);
  s.g.add(s.eye);
  scene.add(s.g);
  glowLights.push(s.eye);
  return s;
});
glowLights.push(lamp);
function skulkerFlee(s, px, pz) {
  const taken = skulkers.map(o => o.at);
  const far = DARK.map((p, i) => ({ i, d: Math.hypot(p[0] - px, p[1] - pz) })).filter(o => !taken.includes(o.i)).sort((a, b) => b.d - a.d);
  const ok = far.filter(o => o.d > 8);
  const pick = ok.length ? ok[Math.floor(Math.random() * ok.length)] : far[0];
  s.at = pick.i;
  [s.tx, s.tz] = DARK[pick.i];
  if (s.state !== 'flee') tone(1100, 320, 0.35, 'sawtooth', 0.3 * near(Math.hypot(s.x - px, s.z - pz)));
  s.state = 'flee';
}
function updateSkulker(s, dt, px, pz) {
  const dx = px - s.x, dz = pz - s.z, d = Math.hypot(dx, dz);
  // lit = inside the torch beam, or caught by the camera flash
  const beam = flashlight.intensity > 0 && d < SKULKER.litRange && -(dx * beamDir.x + dz * beamDir.z) / (d || 1) > Math.cos(flashlight.angle);
  const lit = beam || (game.flashT > 0 && inView(s.x, s.z, 14));
  if (s.state === 'hide') {
    s.face = Math.atan2(dx, dz); // it watches you
    if (lit) skulkerFlee(s, px, pz);
    else if (pz < FAC_Z0 && d < SKULKER.sense) { s.state = 'windup'; s.t = SKULKER.windup; tone(3200, 1800, 0.4, 'sawtooth', 0.12); }
  } else if (s.state === 'windup') {
    if (lit) skulkerFlee(s, px, pz);
    else if ((s.t -= dt) <= 0) { // commits to where you are now, and overshoots
      s.tx = px + dx / d * 1.5; s.tz = pz + dz / d * 1.5;
      s.state = 'dive';
    }
  } else {
    const gx = s.tx - s.x, gz = s.tz - s.z, gd = Math.hypot(gx, gz), step = SKULKER[s.state] * dt;
    if (s.state === 'dive' && d < SKULKER.catchDist) return caught();
    if (gd <= step) {
      s.x = s.tx; s.z = s.tz;
      if (s.state === 'dive') skulkerFlee(s, px, pz); // missed
      else s.state = 'hide';
    } else {
      s.x += gx / gd * step; s.z += gz / gd * step;
      s.face = Math.atan2(gx, gz);
    }
  }
  const hot = s.state === 'windup' || s.state === 'dive';
  s.eyeMat.color.setRGB(hot ? 3 : 0.25, hot ? 1.4 : 0.12, hot ? 0.2 : 0.02);
  s.eye.intensity = hot ? 1.2 : 0.1;
  s.g.position.set(s.x, groundH(s.x, s.z) + (s.state === 'hide' ? -0.12 : 0), s.z); // pressed low while hiding
  s.g.rotation.y = s.face;
}

// ---------- caught, reload, win
function caught() {
  if (game.dead) return;
  game.dead = true;
  tone(90, 40, 1.2, 'sawtooth', 0.4);
  setFade('#400', 0.92, 0.25);
  say('CAUGHT', 3);
  setTimeout(() => { resetGame(); startWake(); }, 2300);
}
// Back to the last save. The lab is the only save in the demo, so everything since waking is lost.
function resetGame() {
  Object.assign(game, { hasTorch: false, hasCamera: false, hasKey: false, dead: false, won: false, wake: 0, shotCooldown: 0, flashT: 0 });
  game.evidence.clear();
  flashlightOn = false; battery = 0; eyeH = EYE;
  noteOpen = false; noteView.style.display = 'none';
  items.forEach(it => { it.active = true; it.mesh.visible = true; });
  facOpen[doorCell[0]][doorCell[1]] = false;
  door.position.y = WALL_H / 2;
  const [sx, sz] = cellCenter(...findCell('S'));
  camera.position.set(sx, EYE, sz);
  camera.quaternion.setFromEuler(camEuler.set(0, Math.PI / 2, 0, 'YXZ')); // facing the note and the torch
  beamDir.set(-1, 0, 0);
  [howler.x, howler.z] = cellCenter(...findCell('H'));
  Object.assign(howler, { state: 'wander', path: [], point: null, wait: HOWLER.grace, click: 2, heardT: -9 });
  game.warned = false;
  howler.g.position.set(howler.x, 0, howler.z);
  skulkers.forEach(s => { s.at = s.home; [s.x, s.z] = DARK[s.home]; s.state = 'hide'; });
  applyBright();
}
function win() {
  game.won = true;
  if (controls.isLocked) controls.unlock();
  overlay.style.display = 'none';
  noteText.textContent = `Outpost 2. The keycard works. The door seals behind you.\n\nDEMO COMPLETE\nEvidence recorded: ${game.evidence.size}/3`;
  document.getElementById('noteClose').textContent = 'Play again';
  noteView.style.display = 'flex';
}

function updateGame(dt, live, active) {
  const px = camera.position.x, pz = camera.position.z;
  if (live) { game.wake += dt; game.shotCooldown -= dt; }
  game.flashT -= dt;
  flashBulb.intensity = game.flashT > 0 ? 90 : 0;
  if (clock.elapsedTime > msgUntil) msgEl.textContent = '';

  // winding the torch: slow, loud, and not while running
  if (active && game.hasTorch && (keys['KeyR'] || mobileCrank) && !game.running) {
    battery = Math.min(100, battery + CRANK_RATE * dt);
    if ((crankTimer += dt) > 0.22) {
      crankTimer = 0;
      tone(300 + Math.random() * 90, 190, 0.05, 'square', 0.08);
      makeNoise(px, pz, NOISE_CRANK);
    }
  }
  const it = active && nearestItem();
  promptEl.textContent = it ? `${isMobile ? 'USE' : 'E'}: ${typeof it.label === 'function' ? it.label() : it.label}` : '';

  if (!live) return; // paused, dead or finished: the creatures hold still
  updateHowler(dt, px, pz);
  skulkers.forEach(s => updateSkulker(s, dt, px, pz));
  if (!game.dead && Math.hypot(px - OUTPOST.x, pz - (OUTPOST.z + 1.9)) < 1.4) win();
}
resetGame();
window.demo = { game, camera, howler, skulkers, items, DARK, OUTPOST, cellCenter, findCell, makeNoise, takePhoto, interact, howlerHear,
  get battery() { return battery; }, set battery(v) { battery = v; } }; // handle for tests and tuning

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  const playing = controls.isLocked || isMobile;

  // Subtle PS1 camera jitter
  if (playing && overlay.style.display === 'none') {
    // offset, not a random walk: no drift
    camera.position.x -= jitterX;
    jitterX = (Math.random() - 0.5) * 0.004;
    camera.position.x += jitterX;
    camera.position.y = groundH(camera.position.x, camera.position.z) + eyeH + (Math.random() - 0.5) * 0.003 + Math.sin(bobPhase) * 0.045 * bobAmt;
  }

  // Emergency lights: one pulses, one is failing
  redEye1.intensity = 14 + Math.sin(clock.elapsedTime * 3.5) * 5;
  redEye2.intensity = (12 + Math.sin(clock.elapsedTime * 2.1 + 1) * 4) * (Math.random() < 0.06 ? 0.15 : 1);

  // Animated fog
  scene.fog.density = fogDensity * (1 + Math.sin(clock.elapsedTime * 0.15) * 0.2);
  postMat.uniforms.volDensity.value = scene.fog.density;

  // Noise stays at the slider value (the old threat / low-battery pulse read as a glitch)
  postMat.uniforms.noiseAmount.value = +noiseEl.value;

  // Lightning flash
  lightning -= dt;
  if (Math.random() < 0.0008) lightning = 0.08;

  // Leaf sway (phase from the tree's world x)
  for (const leaf of leaves) {
    leaf.rotation.z = Math.sin(clock.elapsedTime * 0.8 + leaf.parent.position.x) * 0.04;
  }

  // Ground UV scroll
  if (groundMat.map) groundMat.map.offset.x = clock.elapsedTime * 0.002;

  // Battery drain while the flashlight is on
  if (playing && overlay.style.display === 'none' && flashlightOn) {
    battery = Math.max(0, battery - dt * 1.8);
  }
  applyBright();

  // Movement + collision + footsteps. Sneaking is slow and near silent; running is fast and loud.
  let moved = false, strafe = 0, mode = 'walk';
  const live = playing && overlay.style.display === 'none' && !game.dead && !game.won;
  const active = live && !noteOpen && game.wake > 1.5;
  if (active) {
    const dir = new THREE.Vector3();
    if (isMobile) {
      dir.x = mobileMove.x; dir.z = mobileMove.z;
      const m = dir.length(); // how far the stick is pushed picks the pace
      mode = m < 0.45 ? 'sneak' : m > 0.95 ? 'run' : 'walk';
    } else {
      if (keys['KeyW'] || keys['ArrowUp']) dir.z -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dir.z += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dir.x -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dir.x += 1;
      mode = keys['KeyC'] ? 'sneak' : (keys['ShiftLeft'] || keys['ShiftRight']) ? 'run' : 'walk';
    }
    if (dir.lengthSq()) {
      dir.normalize();
      const pace = PACE[mode], step = pace.speed * Math.min(1, game.wake / 5) * dt; // groggy at first
      // move in camera space, then test the real world position
      const px = camera.position.x, pz = camera.position.z;
      controls.moveRight(dir.x * step);
      controls.moveForward(-dir.z * step);
      const nx = camera.position.x, nz = camera.position.z;
      // slide along walls: the full move first, then each axis alone
      const spot = [[nx, nz], [nx, pz], [px, nz]].find(([x, z]) => canStand(x, z, px, pz));
      camera.position.x = spot ? spot[0] : px;
      camera.position.z = spot ? spot[1] : pz;
      if (spot) {
        moved = true; strafe = dir.x;
        footstepTimer += dt;
        if (footstepTimer > pace.stride) {
          footstepTimer = 0;
          playFootstep(pace.vol);
          makeNoise(camera.position.x, camera.position.z, pace.noise);
        }
      }

  const crouched = active && mode === 'sneak' && (!isMobile || moved);

  // Head bob (one dip per footstep) + lean into strafes
  bobAmt += ((moved ? 1 : 0) - bobAmt) * Math.min(1, dt * 8);
  if (moved) bobPhase += dt * 14;
  roll += (-strafe * 0.03 - roll) * Math.min(1, dt * 6);
  camEuler.setFromQuaternion(camera.quaternion, 'YXZ');
  camEuler.z = roll + Math.sin(game.wake * 2.2) * 0.12 * Math.max(0, 1 - game.wake / 5); // waking, unsteady
  camera.quaternion.setFromEuler(camEuler);

  // Flashlight: the beam trails the view and sways in the hand
  camera.getWorldDirection(camFwd);
  beamDir.lerp(camFwd, 1 - Math.exp(-dt * 9)).normalize();
  flashlight.target.position.copy(beamDir).applyQuaternion(camInv.copy(camera.quaternion).invert());
  flashlight.target.position.x += Math.sin(clock.elapsedTime * 1.3) * 0.015;
  flashlight.target.position.y += Math.sin(clock.elapsedTime * 1.9) * 0.012;
  postMat.uniforms.flashDir.value.copy(flashlight.target.position).normalize();
  flashlight.target.position.add(flashlight.position);

  updateGame(dt, live, active);

  // Rain streaks; each one that lands leaves a short splash
  const rpos = rain.geometry.attributes.position.array;
  for (let i = 0; i < splashCount; i++) {
    if (splashLife[i] > 0 && (splashLife[i] -= dt) <= 0) splashPos[i*3+1] = -10;
  }
  for (let i = 0; i < rainCount; i++) {
    rpos[i*6+1] -= dt * 14;
    const floorY = groundH(rpos[i*6], rpos[i*6+2]);
    if (rpos[i*6+1] < floorY) {
      splashPos[splashNext*3] = rpos[i*6];
      splashPos[splashNext*3+1] = floorY + 0.04;
      splashPos[splashNext*3+2] = rpos[i*6+2];
      splashLife[splashNext] = 0.12;
      splashNext = (splashNext + 1) % splashCount;
      rpos[i*6+1] = RAIN_TOP;
    }
    rpos[i*6+4] = rpos[i*6+1] - RAIN_LEN;
  }
  rain.geometry.attributes.position.needsUpdate = true;
  splashGeo.attributes.position.needsUpdate = true;

  moon.shadow.needsUpdate = renderer.info.render.frame % 4 === 0;
  renderer.setRenderTarget(lowRes);
  renderer.render(scene, camera);

  postMat.uniforms.time.value = clock.elapsedTime;
  glowLights.forEach((l, i) => {
    l.getWorldPosition(postMat.uniforms.glowPos.value[i]);
    postMat.uniforms.glowCol.value[i].copy(l.color).multiplyScalar(l.intensity);
  });
  postMat.uniforms.flashOn.value = Math.min(1, flashlight.intensity / baseFlash); // follows flicker
  postMat.uniforms.battery.value = battery / 100.0;
  postMat.uniforms.lightning.value = (lightning > 0 || game.flashT > 0) ? 1.0 : 0.0;
  postMat.uniforms.moonMap.value = moon.shadow.map && moon.shadow.map.texture;
  quad.material = postMat;
  renderer.setRenderTarget(crushRT);
  renderer.render(upScene, upCam);

  quad.material = upMat;
  renderer.setRenderTarget(null);
  renderer.render(upScene, upCam);

  frames++;
  if (clock.elapsedTime - lastFps > 0.5) {
    hud.textContent = `FPS: ${Math.round(frames / (clock.elapsedTime - lastFps))} | Flash: ${flashlightOn ? 'ON' : 'OFF'} | Bat: ${Math.round(battery)}% | ${lowRes.width}×${lowRes.height}`;
    frames = 0; lastFps = clock.elapsedTime;
  }
}
animate();
</script>
