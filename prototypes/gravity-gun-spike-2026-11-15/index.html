<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity Gun Spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-variant-numeric: tabular-nums; }
  canvas { display: block; margin: 0 auto; }
  #gl { position: absolute; left: 0; right: 0; }
  #game { position: relative; cursor: crosshair; }

<body>
<script>
// A load or WebGL failure is shown, never a silent black screen.
addEventListener('error', e => document.body.insertAdjacentHTML('beforeend',
  '<p style="position:absolute;top:0;left:0;z-index:9;margin:16px;color:#fff;font:18px sans-serif">The game could not start: ' +
  (e.message || 'a file did not load (' + (e.target.src || '?') + ')') +
  '. Open index.html from its folder in Chrome, Edge or Firefox.</p>'), true);
</script>
<canvas id="gl"></canvas>
<canvas id="game"></canvas>
<script src="vendor/three.js"></script>
<script src="config.js"></script>
<script>
'use strict';
// The one-shot's starter: only what the checks read. Keep the fixed step, the clock hook,
// window.game and the play and figures scenes. Everything else is the game's own: replace
// what is marked "the game", and draw every figure in the brief's look, in 2D or with three.js.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size; a pixel look lowers it and sets PIXEL
const PIXEL = false;            // pixel looks: whole-number scale, no smoothing
const FONT = '"Trebuchet MS", "Segoe UI", sans-serif';      // the brief's look picks the type
const TITLE = 'Gravity Gun Spike';
const CONTROLS = ['WASD: move    Space: jump', 'Mouse or arrows: look', 'Click or F: fire the gravity gun', 'The surface you hit becomes the ground', 'R: reset room    P: pause    M: mute']; // shown on the title screen
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const glCanvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: !CHEAP });
renderer.setPixelRatio(CHEAP ? 0.5 : devicePixelRatio);
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  renderer.setSize(Math.round(W * s), Math.round(H * s)); glCanvas.style.marginTop = canvas.style.marginTop;
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center') {
  ctx.fillStyle = c; ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
let mdx = 0, mdy = 0; // mouse look, read on the step
addEventListener('pointerdown', () => { startAudio(); hit.add('Mouse0'); canvas.requestPointerLock()?.catch?.(() => {}); });
addEventListener('mousemove', e => { if (document.pointerLockElement) { mdx += e.movementX; mdy += e.movementY; } });
// Escape frees the mouse without a keydown: pause then, and a click comes back.
document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && scene === 'play') scene = 'pause'; });
addEventListener('blur', () => down.clear());

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'square', vol = 0.3) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}

// ---- The game: a test chamber where the surface you shoot becomes the ground ------------
// shortcut: every surface is axis-aligned and bodies are boxes that never rotate, so gravity
// is one of six directions; upgrade to a physics library when ramps or tumbling crates matter.
const AXES = ['x', 'y', 'z'];
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const box = (cx, cy, cz, hx, hy, hz) => ({ c: V(cx, cy, cz), h: V(hx, hy, hz) }); // centre, half size
const overlap = (p, q) => AXES.every(k => Math.abs(p.c[k] - q.c[k]) < p.h[k] + q.h[k] - 1e-6);

// The chamber: 16 wide, 8 high, 32 long (metres), seen from inside.
const walls = [
  box(0, -0.5, 0, 9, 0.5, 17), box(0, 8.5, 0, 9, 0.5, 17),
  box(-8.5, 4, 0, 0.5, 4, 16), box(8.5, 4, 0, 0.5, 4, 16),
  box(0, 4, -16.5, 8, 4, 0.5), box(0, 4, 16.5, 8, 4, 0.5),
];
const blocks = [
  box(-4, 1, -4, 2, 1, 2),        // a platform too high to jump onto
  box(4, 4, 0, 1, 4, 1),          // a pillar, floor to ceiling
  box(-7, 5, 4, 1, 0.25, 3),      // a ledge high on a wall
  box(2, 6.5, -8, 1.5, 1.5, 1.5), // a block hanging from the ceiling
  box(0, 2, 6, 8, 2, 0.5),        // a half-height barrier across the room
  box(5, 4, 11, 3, 0.25, 3),      // a catwalk that can break a long fall
];
const statics = walls.concat(blocks);
const CRATE_START = [[2, 0.5, -10], [2, 1.5, -10], [-2, 0.5, -8], [-4, 2.5, -4], [0, 0.5, 2], [5, 0.5, 10]];
const crates = CRATE_START.map(p => ({ ...box(...p, 0.5, 0.5, 0.5), v: V(0, 0, 0) }));
const player = { ...box(0, 0.6, -12, 0.6, 0.6, 0.6), v: V(0, 0, 0), grounded: false, prev: V(0, 0.6, -12) };
const EYE = 0.45; // metres above the player's centre, along up
const solids = statics.concat(crates), crateSolids = solids.concat(player);

// Move a body one step, an axis at a time; a hit puts it flush against what it hit.
function moveBody(b, others, onHit) {
  for (const a of AXES) {
    const v = b.v[a]; if (!v) continue;
    b.c[a] += v * STEP;
    for (const o of others) {
      if (o === b || !overlap(b, o)) continue;
      b.c[a] = o.c[a] - Math.sign(v) * (o.h[a] + b.h[a]);
      b.v[a] = 0; onHit(a, v, o);
    }
  }
}
// The nearest wall or block face along a ray: { t, a: the face's axis, p: the point }.
function raycast(o, d) {
  let best = null;
  for (const s of statics) {
    let t0 = 0, t1 = Infinity, axis = null;
    for (const a of AXES) {
      if (Math.abs(d[a]) < 1e-9) { if (Math.abs(o[a] - s.c[a]) > s.h[a]) { t0 = Infinity; break; } continue; }
      let n = (s.c[a] - s.h[a] - o[a]) / d[a], f = (s.c[a] + s.h[a] - o[a]) / d[a];
      if (n > f) [n, f] = [f, n];
      if (n > t0) { t0 = n; axis = a; }
      t1 = Math.min(t1, f);
    }
    if (axis && t0 <= t1 && (!best || t0 < best.t)) best = { t: t0, a: axis };
  }
  if (best) best.p = o.clone().addScaledVector(d, best.t);
  return best;
}
console.assert(raycast(V(0, 1, 0), V(0, -1, 0)).a === 'y' && raycast(V(0, 1, 0), V(1, 0, 0)).t === 3, 'raycast self-check');

// Gravity and the view. qBase turns world-up into the player's up; yaw and pitch look around in it.
let g, yaw, pitch, flipT;
const qBase = new THREE.Quaternion(), camQ = new THREE.Quaternion(), flipFrom = new THREE.Quaternion();
const upVec = () => { const u = V(0, 0, 0); u[g.a] = -g.s; return u; };
const lookQ = (p = pitch) => qBase.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(p, yaw, 0, 'YXZ')));
const eyePos = c => c.clone().addScaledVector(upVec(), EYE);
function setGravity(a, s) {
  if (a === g.a && s === g.s) return;
  const fwd = V(0, 0, -1).applyQuaternion(lookQ()), oldUp = upVec();
  g = { a, s };
  qBase.premultiply(new THREE.Quaternion().setFromUnitVectors(oldUp, upVec()));
  // Keep looking at what was shot: only the roll changes, so the player watches the fall.
  const d = fwd.applyQuaternion(qBase.clone().invert());
  pitch = Math.max(-1.5, Math.min(1.5, Math.asin(Math.max(-1, Math.min(1, d.y)))));
  yaw = Math.atan2(-d.x, -d.z);
  flipFrom.copy(camQ); flipT = 0; player.grounded = false;
  state.gravity = (s > 0 ? '+' : '-') + a;
}
function respawn() {
  g = { a: 'y', s: -1 }; qBase.identity(); yaw = Math.PI; pitch = 0; flipT = 99;
  player.c.set(0, 0.6, -12); player.prev.copy(player.c); player.v.set(0, 0, 0); player.grounded = false;
  crates.forEach((c, i) => { c.c.set(...CRATE_START[i]); c.v.set(0, 0, 0); });
  camQ.copy(lookQ()); marker.visible = false;
  state.gravity = '-y'; state.dead = 0; state.beam = 0; state.aim = null;
}
function shoot() {
  const o = eyePos(player.c), d = V(0, 0, -1).applyQuaternion(lookQ()), hitAt = raycast(o, d);
  if (!hitAt) return;
  const s = Math.sign(d[hitAt.a]), n = V(0, 0, 0); n[hitAt.a] = -s;
  marker.position.copy(hitAt.p).addScaledVector(n, 0.03);
  marker.quaternion.setFromUnitVectors(V(0, 0, 1), n); marker.visible = true;
  beam.geometry.setFromPoints([o.clone().addScaledVector(upVec(), -0.25), hitAt.p]);
  state.beam = 0.12; state.shots++; events.push('shot'); tone(520, 0.18, 'sawtooth', 0.2); tone(130, 0.3, 'sine', 0.3);
  setGravity(hitAt.a, s);
}
function updatePlay(dt) {
  if (state.dead > 0) { state.dead -= dt; if (state.dead <= 0) respawn(); return; }
  if (pressed('KeyR')) { respawn(); return; }
  // Look
  const turn = tune.key_turn * dt;
  yaw += (down.has('ArrowLeft') - down.has('ArrowRight')) * turn - mdx * tune.look_sens;
  pitch += (down.has('ArrowUp') - down.has('ArrowDown')) * turn - mdy * tune.look_sens;
  pitch = Math.max(-1.5, Math.min(1.5, pitch)); mdx = mdy = 0;
  if (pressed('Mouse0') || pressed('KeyF')) shoot();
  // Walk: on the ground the feet grip; in the air momentum carries, and a held key steers a little.
  const flat = lookQ(0);
  const wish = V(0, 0, -1).applyQuaternion(flat).multiplyScalar(down.has('KeyW') - down.has('KeyS'))
    .addScaledVector(V(1, 0, 0).applyQuaternion(flat), down.has('KeyD') - down.has('KeyA'));
  const moving = wish.lengthSq() > 0; if (moving) wish.normalize();
  const p = player, k = p.grounded ? tune.ground_grip : moving ? tune.air_control : 0;
  for (const a of AXES) if (a !== g.a) p.v[a] += (wish[a] * tune.move_speed - p.v[a]) * k;
  if (p.grounded && pressed('Space')) { p.v[g.a] = -g.s * Math.sqrt(2 * tune.gravity * tune.jump_height); tone(300, 0.08, 'sine', 0.15); }
  p.v[g.a] = Math.max(-40, Math.min(40, p.v[g.a] + g.s * tune.gravity * dt));
  p.grounded = false; p.prev.copy(p.c);
  moveBody(p, solids, (a, v, o) => {
    if (a !== g.a) { if (o.v) o.v[a] = v; return; } // walking into a crate pushes it
    if (Math.sign(v) !== g.s) return;               // bumped the head
    p.grounded = true;
    const speed = Math.abs(v);
    if (speed > tune.lethal_speed) {
      state.dead = tune.respawn_time; state.deaths++; events.push('death'); tone(70, 0.6, 'sawtooth', 0.4);
    } else if (speed > 5) tone(90, 0.12, 'sine', 0.35);
  });
  // Crates fall to the same ground.
  for (const c of crates) {
    for (const a of AXES) if (a !== g.a) c.v[a] *= tune.crate_drag;
    c.v[g.a] = Math.max(-40, Math.min(40, c.v[g.a] + g.s * tune.gravity * dt));
    moveBody(c, crateSolids, (a, v) => { if (a === g.a && Math.abs(v) > 5) tone(160, 0.08, 'square', 0.12); });
  }
  // The view rolls to the new ground.
  flipT += dt;
  const e = Math.min(1, flipT / Math.max(tune.flip_time, 1e-3));
  camQ.copy(flipFrom).slerp(lookQ(), e * e * (3 - 2 * e));
  // What the gun points at: how far the fall would be, and whether it would kill.
  const d = V(0, 0, -1).applyQuaternion(lookQ()), aim = raycast(eyePos(p.c), d);
  state.aim = null;
  if (aim && !(aim.a === g.a && Math.sign(d[aim.a]) === g.s)) {
    const fall = Math.max(0, Math.abs(aim.p[aim.a] - p.c[aim.a]) - p.h[aim.a]);
    state.aim = { fall, lethal: Math.sqrt(2 * tune.gravity * fall) > tune.lethal_speed };
  }
  state.beam -= dt; state.grounded = p.grounded;
}

// ---- The look: a clean test facility, pale panels, cyan gun light, orange crates ----------
const world = new THREE.Scene();
world.background = new THREE.Color(0x0b0f14); world.fog = new THREE.Fog(0x0b0f14, 24, 80);
const camera = new THREE.PerspectiveCamera(80, W / H, 0.05, 120);
world.add(camera, new THREE.AmbientLight(0xdfe8f5, 0.75));
for (const z of [-10, 0, 10]) { const l = new THREE.PointLight(0xffffff, 30, 0, 2); l.position.set(0, 4, z); world.add(l); }
function panelTex(base, line, accent) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 256, 256);
  x.strokeStyle = line; x.lineWidth = 6; x.strokeRect(3, 3, 250, 250);
  x.fillStyle = line;
  for (const [px, py] of [[22, 22], [234, 22], [22, 234], [234, 234]]) { x.beginPath(); x.arc(px, py, 5, 0, 7); x.fill(); }
  if (accent) { // a braced crate face
    x.strokeStyle = accent; x.lineWidth = 18; x.strokeRect(30, 30, 196, 196);
    x.beginPath(); x.moveTo(30, 30); x.lineTo(226, 226); x.moveTo(226, 30); x.lineTo(30, 226); x.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function boxMesh(b, mat, tile) { // a textured box, its panels tiled every `tile` metres
  const geo = new THREE.BoxGeometry(b.h.x * 2, b.h.y * 2, b.h.z * 2), uv = geo.attributes.uv;
  const dims = [['z', 'y'], ['z', 'y'], ['x', 'z'], ['x', 'z'], ['x', 'y'], ['x', 'y']];
  for (let i = 0; i < 24; i++) { const [u, v] = dims[i >> 2]; uv.setXY(i, uv.getX(i) * b.h[u] * 2 / tile, uv.getY(i) * b.h[v] * 2 / tile); }
  const m = new THREE.Mesh(geo, mat); m.position.copy(b.c); world.add(m); return m;
}
const wallMat = new THREE.MeshStandardMaterial({ map: panelTex('#dfe3e8', '#9aa4b0'), roughness: 0.7 });
const blockMat = new THREE.MeshStandardMaterial({ map: panelTex('#7f93aa', '#4c5c70'), roughness: 0.6 });
const crateMat = new THREE.MeshStandardMaterial({ map: panelTex('#3a4350', '#20262e', '#ff8a1f'), roughness: 0.5 });
walls.forEach(b => boxMesh(b, wallMat, 2)); blocks.forEach(b => boxMesh(b, blockMat, 1));
crates.forEach(c => { c.mesh = boxMesh(c, crateMat, 1); });
for (const z of [-10, 0, 10]) { // light strips on the ceiling
  const s = new THREE.Mesh(new THREE.BoxGeometry(6, 0.06, 0.5), new THREE.MeshBasicMaterial({ color: 0xf4fbff }));
  s.position.set(0, 7.97, z); world.add(s);
}
const glow = new THREE.MeshBasicMaterial({ color: 0x35e0ff, side: THREE.DoubleSide });
const marker = new THREE.Mesh(new THREE.RingGeometry(0.45, 0.6, 40), glow); marker.visible = false; // where the ground was set
const beam = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0x35e0ff }));
beam.frustumCulled = false; world.add(marker, beam);
// The gravity gun, held in view.
const gun = new THREE.Group(), gunMat = new THREE.MeshStandardMaterial({ color: 0x2b323c, roughness: 0.4, metalness: 0.6 });
const part = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); gun.add(m); return m; };
part(new THREE.BoxGeometry(0.09, 0.1, 0.34), gunMat, 0, 0, 0);
part(new THREE.BoxGeometry(0.06, 0.16, 0.07), gunMat, 0, -0.11, 0.11);
part(new THREE.CylinderGeometry(0.035, 0.05, 0.22, 12), gunMat, 0, 0.01, -0.26).rotation.x = Math.PI / 2;
part(new THREE.TorusGeometry(0.06, 0.014, 8, 20), glow, 0, 0.01, -0.3);
part(new THREE.TorusGeometry(0.06, 0.014, 8, 20), glow, 0, 0.01, -0.2);
part(new THREE.SphereGeometry(0.035, 12, 8), glow, 0, 0.07, 0.02);
gun.position.set(0.26, -0.22, -0.5); camera.add(gun);

function drawWorld() {
  crates.forEach(c => c.mesh.position.copy(c.c));
  beam.visible = state.beam > 0;
  renderer.render(world, camera);
  ctx.clearRect(0, 0, W, H);
}
function drawHud() {
  const aim = state.aim, col = !aim ? '#9fb0c0' : aim.lethal ? '#ff4136' : '#35e0ff';
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 9, 0, 7); ctx.stroke();
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    ctx.beginPath(); ctx.moveTo(W / 2 + dx * 14, H / 2 + dy * 14); ctx.lineTo(W / 2 + dx * 22, H / 2 + dy * 22); ctx.stroke();
  }
  ctx.shadowColor = '#000'; ctx.shadowBlur = 6;
  if (aim) text(aim.lethal ? `DEADLY FALL  ${aim.fall.toFixed(0)} m` : `fall ${aim.fall.toFixed(0)} m`, W / 2, H / 2 + 48, 22, col);
  text(`Deaths ${state.deaths}`, 24, 30, 22, '#fff', 'left');
  text('WASD move · Space jump · Click or F: make that surface the ground · R reset', W / 2, H - 28, 20, '#fff');
  ctx.shadowBlur = 0;
  if (state.dead > 0) {
    ctx.fillStyle = 'rgba(150, 0, 0, 0.55)'; ctx.fillRect(0, 0, W, H);
    text('You fell too far', W / 2, H / 2 - 60, 56, '#fff');
  }
}

// ---- Scenes -----------------------------------------------------------------------------
// figures: the crate and the gun, for the outline check (?scene=figures). The checks look for play by name.
let scene, state;
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = { t: 0, score: 0, gained: '', deaths: 0, shots: 0 };
  respawn();
}
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      camera.position.set(3.2, 1.3, -12.2); camera.lookAt(2, 1, -10);
      drawWorld(); ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, H - 90, W, 60);
      text('Supply crates', W * 0.42, H - 60, 28, '#fff'); text('Gravity gun', W * 0.8, H - 60, 28, '#fff');
    },
  },
  title: {
    update() { if (pressed('Enter') || pressed('Space') || pressed('Mouse0')) { reset(); scene = 'play'; } },
    draw() {
      clear('#0b0f14'); text(TITLE.toUpperCase(), W / 2, H / 4, 64, '#35e0ff');
      CONTROLS.forEach((c, i) => text(c, W / 2, H / 2 - 50 + i * 40, 26, '#dfe3e8'));
      text('Click or press Enter to start', W / 2, H - 60, 28, '#fff');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      state.t += dt; updatePlay(dt);
    },
    draw() {
      camera.position.copy(eyePos(player.prev.clone().lerp(player.c, ALPHA)));
      camera.quaternion.copy(camQ);
      drawWorld(); drawHud();
    },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || pressed('Mouse0')) scene = 'play'; },
    draw() { scenes.play.draw(); text('Paused: click or P to go on', W / 2, H / 2 - 70, 40, '#fff'); },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
